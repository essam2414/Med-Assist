<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Med Consult Assistant</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
          sans-serif;
        padding: 10px;
      }
      #status {
        margin-bottom: 10px;
      }
      button {
        padding: 6px 10px;
        margin-right: 6px;
        margin-bottom: 6px;
      }
      audio {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h2>Med Consult Assistant</h2>

    <div id="status">Not capturing.</div>

    <button id="start">Start Capture</button>
    <button id="stop" disabled>Stop Capture</button>

    <hr />

    <button id="play" disabled>Play Last Recording</button>
    <audio id="player" controls style="margin-top: 8px;"></audio>

    <script src="panel.js"></script>
  </body>
</html>
