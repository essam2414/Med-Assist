<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Med Assist — Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      background: #0a0f1e;
      color: #f1f5f9;
      padding: 40px 32px;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
    }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 32px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      background: #1e2a3a;
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #3b82f6; }
    .hint { font-size: 12px; color: #64748b; margin-top: 6px; }
    button {
      margin-top: 20px;
      padding: 10px 22px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .saved { color: #10b981; font-size: 13px; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <h1>Med Assist Settings</h1>
  <p class="subtitle">Configure the connection to your Med Assist backend.</p>
  <div>
    <label for="backend-url">Backend URL</label>
    <input type="text" id="backend-url" placeholder="http://localhost:8000" />
    <p class="hint">The URL of your running Med Assist backend server.</p>
  </div>
  <div>
    <label for="dashboard-url" style="margin-top:20px; display:block">Dashboard URL</label>
    <input type="text" id="dashboard-url" placeholder="http://localhost:5173" />
    <p class="hint">The URL of your Med Assist web dashboard.</p>
  </div>
  <button id="save-btn">Save Settings</button>
  <p class="saved" id="saved-msg">✓ Settings saved</p>
  <script src="options.js"></script>
</body>
</html>
