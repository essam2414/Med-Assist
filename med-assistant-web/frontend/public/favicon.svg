<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Solid High-Contrast Background Shape -->
  <rect x="2" y="4" width="28" height="24" rx="6" fill="#2563eb" />
  
  <!-- Antenna -->
  <rect x="14" y="0" width="4" height="6" fill="#2563eb" />
  <circle cx="16" cy="1" r="3" fill="#2563eb" />

  <!-- Eyes - Large for clarity at small sizes -->
  <circle cx="10" cy="14" r="3" fill="white" />
  <circle cx="22" cy="14" r="3" fill="white" />

  <!-- Medical Cross - Bold for clarity -->
  <rect x="14" y="20" width="4" height="6" rx="1" fill="white" />
  <rect x="13" y="21" width="6" height="4" rx="1" fill="white" />
</svg>
